# Render Blueprint for the TaskFlow API.
#
# Render dashboard → New → Blueprint → connect this repo. Render reads this
# file and creates the service. You still supply the secret values marked
# `sync: false` (Render prompts for them, or set them under Environment).
#
# The frontend stays on Netlify — this deploys the `server/` folder only.

services:
  - type: web
    name: taskflow-api
    runtime: node
    plan: free
    rootDir: server
    # --omit=dev skips mongodb-memory-server (~100 MB MongoDB binary), which is
    # only used by the local zero-install dev database.
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

      # Your MongoDB Atlas connection string. REQUIRED — the server refuses to
      # start in production without it, because the embedded dev database would
      # lose every account on each restart.
      - key: MONGODB_URI
        sync: false

      # Generated once by Render. Changing it later logs everyone out.
      - key: JWT_SECRET
        generateValue: true

      # Exact frontend origin, no trailing slash, e.g.
      # https://taskflow.aiuohall.dev
      - key: CLIENT_ORIGIN
        sync: false

      # Email delivery. Use SMTP_* for a transactional provider (recommended)
      # or GMAIL_* for a Gmail App Password.
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
